<!DOCTYPE html>
<html>
<head>
<title>Smart Academic System</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#f5f7fb;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}

.navbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0b1a3a;
  color:white;
}

.navbar a {
  color:white;
  margin-left:20px;
  text-decoration:none;
}

.hero {
  height:65vh;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
  url('https://images.unsplash.com/photo-1562774053-701939374585');
  background-size:cover;
  display:flex;
  align-items:first baseline;
  padding:60px;
  color:white;
}

.cards {
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:-80px;
  padding:40px;
}

.card {
  background: rgba(255,255,255,0.9);
  padding:25px;
  border-radius: 60px;
  width:220px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  transition: all 0.4s ease;
}

.card:hover {
  transform: translateY(-12px) scale(1.03);
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.card button {
  padding:10px;
  border:none;
  border-radius: 60px;
  color:white;
  cursor:pointer;
  margin-top:10px;
}

.btn-blue {background:#4facfe;}
.btn-green {background:#43e97b;}
.btn-purple {background:#a18cd1;}
.btn-orange {background:#ff9a9e;}
</style>
</head>

<body>

<div class="navbar">
  <h2>🎓 Smart Academic</h2>
  <div>
    <a href="/">Home</a>
    <a href="/attendance">Attendance</a>
    <a href="/activity">Activities</a>
    <a href="/view_attendance">View Attendance</a>
    <a href="/view_activity">View Activities</a>
  </div>
</div>

<div class="hero">
  <div>
    <h1>Smart Curriculum Activity & Attendance App</h1>
    <p>Manage students easily</p>
  </div>
</div>

<div class="cards">

  <div class="card">
    <h2>📋</h2>
    <h3>Mark Attendance</h3>
    <a href="/attendance"><button class="btn-blue">Go</button></a>
  </div>

  <div class="card">
    <h2>📅</h2>
    <h3>Add Activity</h3>
    <a href="/activity"><button class="btn-green">Go</button></a>
  </div>

  <div class="card">
    <h2>👥</h2>
    <h3>View Attendance</h3>
    <a href="/view_attendance"><button class="btn-purple">Go</button></a>
  </div>

  <div class="card">
    <h2>📘</h2>
    <h3>View Activities</h3>
    <a href="/view_activity"><button class="btn-orange">Go</button></a>
  </div>

</div>

</body>
</html>
